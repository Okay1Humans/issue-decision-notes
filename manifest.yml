modules:
  jira:issuePanel:
    - key: decision-notes-panel
      resource: panel
      resolver:
        function: resolver
      render: native
      title: Decision notes
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:adminPage:
    - key: decision-notes-admin
      resource: admin
      resolver:
        function: resolver
      render: native
      title: Decision notes settings
  function:
    - key: resolver
      handler: resolvers/index.handler
resources:
  - key: panel
    path: src/frontend/panel.jsx
  - key: admin
    path: src/frontend/admin.jsx
app:
  id: ari:cloud:ecosystem::app/8b109702-3cd6-476c-b08f-13c5d559c084
  runtime:
    name: nodejs24.x
permissions:
  scopes:
    - read:jira-work
    - storage:app
